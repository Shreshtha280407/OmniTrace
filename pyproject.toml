[project]
name = "omnitrace"
version = "0.1.0"
description = "OmniTrace — multimodal evidence pipeline for RAG-ready retrieval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "motor>=3.6",
  "pymongo>=4.10",
  "pymupdf>=1.24",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "python-ulid>=2.7",
  # P2/P3 — no provider SDK; omnitrace/llm.py talks raw HTTP to Groq's
  # OpenAI-compatible API (swappable to OpenAI later, see README).
  "pytesseract>=0.3",
  "pillow>=11.0",
  "imagehash>=4.3",
  "numpy>=2.0",
  "voyageai>=0.3",   # P5 — text + multimodal embeddings
  "pyyaml>=6.0",      # P6 — scripts/calibrate.py's eval/gold.yaml; P9 — eval/gold.yaml
  # P8 grounded generation runs through omnitrace/llm.py's raw-HTTP Groq
  # client (no provider SDK needed) — see that module's docstring for why.
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false
